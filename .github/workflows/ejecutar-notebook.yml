name: ejecutar notebook con salidas

on:
  push:
    paths:
      - '.github/workflows/ejecutar-notebook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install --quiet nbconvert ipykernel pandas matplotlib
      - name: Cabecera para el reclutador
        run: |
          python - <<'PY'
          import nbformat
          from nbformat.v4 import new_markdown_cell

          RUTA = 'Sentiment_Analysis_and_Satisfaction_Drivers_in_E_commerce_Reviews.ipynb'
          TEXTO = '[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Nicolenki7/Customer-Sentiment-Analysis-Product-Improvement-Drivers/blob/main/Sentiment_Analysis_and_Satisfaction_Drivers_in_E_commerce_Reviews.ipynb)\n\n> **En 30 segundos:** de 100.000 reseñas, el 8 % son negativas y esa negatividad no se reparte al azar: unos pocos productos la concentran.\n>\n> - 100.000 reseñas sobre 12.560 productos\n> - 7,99 % de sentimiento negativo (7.987) frente a 9.318 reseñas de 1 estrella\n> - Peor producto con volumen: 65,8 % de negativas sobre 38 reseñas\n>\n> Los resultados ya están ejecutados: no hace falta correr nada para leerlos.'

          nb = nbformat.read(RUTA, as_version=4)
          primero = ''.join(nb.cells[0].source) if nb.cells else ''
          if 'colab-badge.svg' in primero:
              nb.cells[0] = new_markdown_cell(TEXTO)
              nbformat.write(nb, RUTA)
              print('cabecera actualizada')
          elif 'En 30 segundos' not in primero:
              nb.cells.insert(0, new_markdown_cell(TEXTO))
              nbformat.write(nb, RUTA)
              print('cabecera insertada')
          else:
              print('cabecera ya presente')
          PY
      - name: Ajuste de auditoria
        run: |
          python - <<'PY'
          import nbformat

          RUTA = 'Sentiment_Analysis_and_Satisfaction_Drivers_in_E_commerce_Reviews.ipynb'
          nb = nbformat.read(RUTA, as_version=4)
          junto = ''.join(''.join(c.source) for c in nb.cells)
          if 'productos unicos' in junto:
              print('ajuste ya presente')
          else:
              for c in nb.cells:
                  if c.cell_type == 'code' and 'productos unicos' not in c.source and "print('filas:', len(df)" in c.source:
                      c.source = c.source.replace(
                          "print('filas:', len(df), '| columnas:', list(df.columns))",
                          "print('filas:', len(df), '| columnas:', list(df.columns))\nprint('productos unicos:', df['product_id'].nunique())")
                      nbformat.write(nb, RUTA)
                      print('print de productos agregado')
                      break
          PY
      - name: Ejecutar
        run: jupyter nbconvert --to notebook --execute --inplace "Sentiment_Analysis_and_Satisfaction_Drivers_in_E_commerce_Reviews.ipynb" --ExecutePreprocessor.timeout=900
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Sentiment_Analysis_and_Satisfaction_Drivers_in_E_commerce_Reviews.ipynb"
          git commit -m "chore: notebook ejecutado con salidas guardadas" || echo "sin cambios"
          git push
